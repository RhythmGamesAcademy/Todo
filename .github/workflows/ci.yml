name: CI

# push to main は Vercel の Git 統合で直接デプロイされるため、このワークフロー
# は直接プッシュ時の検知(main にも実施)とPR時のゲート(PR → main)を担う。
# Vercel のデプロイ自体を止めるには Deployment Protection(ダッシュボード設定)
# が必要。監査 2026-11-06 M-002。
# 2026-11-08 L-005: アクションはコミット SHA でピン留めし、権限を最小化。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
